name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android · unit and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit, contract and view model tests
        run: ./gradlew :shared:testAndroidHostTest :composeApp:testDebugUnitTest

      - name: Screenshot tests
        run: ./gradlew :composeApp:verifyRoborazziDebug

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          retention-days: 7

  ios:
    name: iOS · shared tests and framework link
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Shared and app tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      # Builds the Kotlin framework through the Xcode build phase, then the app and widget extension.
      # arm64 only: there is no Kotlin iosX64 target, so an x86_64 slice has no framework to embed.
      - name: Build the iOS app and widget
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
